<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Pulse</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Page Pulse</h1>
      <p>Audit any URL for basic SEO and structure metrics</p>
    </header>

    <div class="input-group">
      <input type="url" id="urlInput" placeholder="https://example.com" />
      <button id="auditBtn">Audit</button>
    </div>

    <div id="loading" class="loading hidden">Auditing…</div>

    <div id="errorBox" class="error hidden"></div>

    <div id="report" class="hidden">
      <h2>Report</h2>
      <table>
        <tbody id="reportBody"></tbody>
      </table>
    </div>
  </div>

  <footer>
    Built for <a href="https://digitalheroesco.com" target="_blank" rel="noopener">Digital Heroes Training Task</a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
